/* ================= NAVBAR ================= */
.header {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(18, 186, 17, 0.95);
    backdrop-filter: blur(10px);
    z-index: 1000;
    transition: all 0.3s ease;

    display: flex;

    align-items: center;

.nav-links {
    display: flex;
    list-style: none;
    gap: 2rem;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    position: relative;
}

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background: #ffd700;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a.active{
color:#ffd700;
}
.nav-links a:hover{
color:#ffd700;
}
 .nav-links a.active::after{
            width:100%;
            background: #ffd700;
        }

        .login-btn {
            
            color: white !important;
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #20c997;
            color: white !important;
        }
        
/* ================= REGISTER ================= */

justify-content:center;

padding:40px;

}

color:#28a745;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

.form-group{
margin-bottom:20px;
position:relative;
}

.form-group label{
display:block;
margin-bottom:5px;
font-weight:600;
}

.form-group i{
position:absolute;
left:12px;
top:40px;
color:#28a745;
}

.form-group input,
.form-group select{

width:100%;
padding:12px 12px 12px 40px;
border-radius:8px;
border:2px solid rgba(40,167,69,0.2);
font-size:15px;

}

.btn-register{

width:100%;
padding:14px;
border:none;
border-radius:10px;

background:linear-gradient(45deg,#28a745,#20c997);

color:white;
font-size:16px;
cursor:pointer;

}

.btn-register:hover{

background:linear-gradient(45deg,#20c997,#28a745);

}

.login-text{
text-align:center;
margin-top:15px;
}

.login-text a{
color:#28a745;
font-weight:600;
text-decoration:none;
}

/* ================= FOOTER ================= */

.footer-bottom{

<body>

<!-- ================= NAVBAR ================= -->
<header class="header">
        <nav class="nav">
            <div class="logo">
                <h1><i class="fas fa-leaf"></i> EcoSphere</h1>
            </div>
            <ul class="nav-links">
                <li><a href="./index.html">Home</a></li>
                <!-- <li><a href="./abc.html"> buy materials</a></li> -->

                <li><a href="./login.html" >login</a></li>
            </ul>
        </nav>

<!-- ================= REGISTER ================= -->

<div class="register-container">

<div class="register-card">

<h1>Join EcoSphere 🌱</h1>
<!-- <h1>Join EcoSphere <i class="fa-notdog fa-solid fa-tree"></i></h1> -->

<p class="subtitle">
Turn waste into opportunity. Register to buy, sell, and recycle scrap.
</p>

<form id="registerForm">

<div class="form-group">
<label>Full Name</label>
<i class="fa-solid fa-user"></i>
<input type="text" placeholder="Enter your name" required>
</div>

<div class="form-group">
<label>Email</label>
<i class="fa-solid fa-envelope"></i>
<input type="email" placeholder="Enter your email" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<i class="fa-solid fa-phone"></i>
<input type="tel" placeholder="Enter phone number" required>
</div>

<div class="form-group">
<label>Password</label>
<i class="fa-solid fa-lock"></i>
<input type="password" placeholder="Create password" required 
pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
title="Must contain at least 8 characters, including uppercase, lowercase, number and special character">
</div>

<div class="form-group">
<label>Address</label>
<i class="fa-solid fa-address-card"></i>
<input type="text" placeholder="Add Address" required>
</div>

<div class="form-group">
<label>Gender</label>
<i class="fa-solid fa-user"></i>
<select required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Others</option>
</select>
</div>

<!-- BANK DETAILS -->
<div class="bank-section">

<!-- <h3><i class="fa-solid fa-building-columns"></i> Bank Details</h3> -->

<div class="form-group">
<label>Account Holder</label>
<i class="fas fa-user-circle"></i>
<!-- <input type="text" id="accName"> -->
 <input type="text" placeholder="Enter the Account Holder" required 
pattern="[A-Za-z ]{3,}">
</div>

<div class="form-group">
<label>Account Number</label>
<i class="fas fa-credit-card"></i>
<input type="text" placeholder="Enter the Account Number" required 
pattern="[0-9]{9,18}"
title="Enter a valid account number (9–18 digits)">
</div>

<div class="form-group">
<label>IFSC Code</label>
<i class="fas fa-code"></i>
<input type="text" placeholder="Enter the IFSC Code" required 
pattern="^[A-Z]{4}0[A-Z0-9]{6}$"
title="Enter valid IFSC (e.g., SBIN0001234)"
oninput="this.value = this.value.toUpperCase()">
</div>

<div class="form-group">
<label>Select Bank:</label>
<i class="fas fa-university"></i>
<select required>
    <option value="" disabled selected>Select Bank</option>
    <option value="SBI">State Bank of India (SBI)</option>
    <option value="HDFC">HDFC Bank</option>
    <option value="ICICI">ICICI Bank</option>
    <option value="AXIS">Axis Bank</option>
    <option value="PNB">Punjab National Bank (PNB)</option>
    <option value="BOB">Bank of Baroda (BOB)</option>
    <option value="CANARA">Canara Bank</option>
    <option value="UNION">Union Bank of India</option>
    <option value="IDBI">IDBI Bank</option>
    <option value="INDIAN">Indian Bank</option>
    <option value="KOTAK">Kotak Mahindra Bank</option>
    <option value="YES">Yes Bank</option>
    <option value="FEDERAL">Federal Bank</option>
    <option value="SOUTH">South Indian Bank</option>
    <option value="KARUR">Karur Vysya Bank</option>
    <option value="OTHER">Other</option>
</select>

<input type="text" id="otherBank" placeholder="Enter Bank Name" style="display:none;">

</div>

</div>

<button type="submit" class="btn-register">Create Account</button>

<!-- <p class="back-arrow">
<a href="index.html">⬅</a>
</p> -->

<p class="login-text">
Already have an account? 
<a href="./login.html">Login</a> 
</p>

</form>



</div>

</div>

<!-- ================= FOOTER ================= -->

<footer class="footer">

<div class="footer-bottom">
<p>© 2026 EcoSphere. All rights reserved. | Making sustainability profitable.</p>
</div>

</footer>

e.preventDefault();

// alert("Registration Successful 🌱 Welcome to EcoSphere!");
 alert("Registration Successful 🌱 Welcome to EcoSphere! A World where Nature, Environment and Life Exist together");

window.location.href = "admin.html";
// window.location.href = "seller.html";
// window.location.href = "recycler.html";

});

</script>
<script>
function showOtherBank(value){
    document.getElementById("otherBank").style.display = (value === "OTHER") ? "block" : "none";
}
</script>
