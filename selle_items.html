<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoSphere – List Items</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

  :root {
    --font: 'Segoe UI', 'Segoe UI Historic', 'Segoe UI Emoji', Tahoma, Geneva, Verdana, sans-serif;
    --green:       #18a118;
    --green-dark:  #16a34a;
    --green-light: #dcfce7;
    --green-mid:   #4ade80;
    --navy:        #1b2636;
    --slate:       #1e293b;
    --muted:       #64748b;
    --border:      #e2e8f0;
    --bg:          #f0f2f0;
    --card:        #fff;
    --red:         #ef4444;
    --amber:       #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--slate);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: var(--green);
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
  }
  .hamburger {
    background: none; border: none; color: #fff;
    font-size: 20px; cursor: pointer; padding: 6px;
    border-radius: 6px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
    transition: background 0.2s; font-family: var(--font);
  }
  .hamburger:hover { background: rgba(255,255,255,0.15); }
  .logo {
    flex: 1; font-size: 1.25rem; font-weight: 700; color: #fff;
    text-decoration: none; letter-spacing: -0.3px; font-family: var(--font);
  }
  .logo i { color: #ffd700; margin-right: 6px; }
  .profile-link {
    color: #fff; font-size: 22px; opacity: 0.9;
    transition: opacity 0.2s; text-decoration: none;
  }
  .profile-link:hover { opacity: 1; }

  /* ── OVERLAY ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 998;
  }
  .overlay.show { display: block; }

  /* ── SIDEBAR ── */
  .sidebar {
    position: fixed; top: 0; left: 0;
    width: 210px; height: 100vh;
    background: var(--navy); z-index: 999;
    transition: transform 0.28s ease;
    display: flex; flex-direction: column;
    padding-top: 60px;
  }
  .sidebar-close {
    position: absolute; top: 14px; right: 14px;
    background: none; border: none;
    color: rgba(255,255,255,0.5); font-size: 18px;
    cursor: pointer; display: none; font-family: var(--font);
  }
  .sidebar-brand {
    padding: 18px 20px 16px;
    font-size: 0.78rem; font-weight: 700;
    color: rgba(255,255,255,0.35); text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 8px; font-family: var(--font);
  }
  .sidebar a {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 20px; color: rgba(255,255,255,0.65);
    text-decoration: none; font-size: 0.88rem;
    font-weight: 500; font-family: var(--font);
    transition: color 0.2s, background 0.2s, padding-left 0.2s;
  }
  .sidebar a i { width: 16px; text-align: center; font-size: 0.85rem; }
  .sidebar a:hover { color: #fff; background: rgba(255,255,255,0.07); padding-left: 26px; }
  .sidebar a.active { color: var(--green-mid); background: rgba(74,222,128,0.1); }
  .sidebar a.active i { color: var(--green-mid); }
  .sidebar-spacer { flex: 1; }
  .sidebar a.logout { color: rgba(248,113,113,0.8); margin-bottom: 12px; }
  .sidebar a.logout:hover { color: #f87171; background: rgba(248,113,113,0.08); padding-left: 26px; }

  /* ── LAYOUT ── */
  .layout {
    margin-top: 60px; margin-left: 210px;
    min-height: calc(100vh - 60px);
    display: flex; flex-direction: column;
  }
  .content { flex: 1; padding: 28px 24px; }

  /* ── PAGE TITLE ── */
  .page-title {
    display: flex; align-items: center;
    justify-content: space-between;
    gap: 12px; margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .page-title-left { display: flex; align-items: center; gap: 12px; }
  .page-title-icon {
    width: 46px; height: 46px;
    background: var(--green-light); color: var(--green-dark);
    border-radius: 10px; display: flex;
    align-items: center; justify-content: center;
    font-size: 1.2rem; flex-shrink: 0;
  }
  .page-title h2 {
    font-size: 1.35rem; font-weight: 700;
    color: var(--slate); font-family: var(--font);
  }
  .page-title h2 span { color: var(--green); }

  /* ── ADD ITEM BTN ── */
  .btn-add {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 20px; border-radius: 8px;
    background: var(--green); color: #fff;
    font-family: var(--font); font-size: 0.85rem;
    font-weight: 600; border: none; cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none; white-space: nowrap;
  }
  .btn-add:hover { background: var(--green-dark); transform: translateY(-1px); }

  /* ── SEARCH & FILTER BAR ── */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .search-wrap {
    position: relative; flex: 1; min-width: 200px; max-width: 320px;
  }
  .search-wrap i {
    position: absolute; left: 11px; top: 50%;
    transform: translateY(-50%); color: var(--muted);
    font-size: 0.82rem; pointer-events: none;
  }
  .search-input {
    width: 100%; padding: 8px 12px 8px 32px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-family: var(--font); font-size: 0.84rem;
    color: var(--slate); background: #fff;
    outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--green); }
  .search-input::placeholder { color: #aab; }

  .cat-select {
    padding: 8px 12px; border-radius: 8px;
    border: 1.5px solid var(--border); font-family: var(--font);
    font-size: 0.84rem; color: var(--slate);
    background: #fff; cursor: pointer; outline: none;
    transition: border-color 0.2s;
  }
  .cat-select:focus { border-color: var(--green); }

  /* ── STATS ROW ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card); border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex; align-items: center; gap: 12px;
  }
  .stat-icon {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .stat-icon.green  { background: #dcfce7; color: #16a34a; }
  .stat-icon.amber  { background: #fef3c7; color: #d97706; }
  .stat-icon.red    { background: #fee2e2; color: #dc2626; }
  .stat-icon.blue   { background: #dbeafe; color: #2563eb; }
  .stat-info { min-width: 0; }
  .stat-value {
    font-size: 1.3rem; font-weight: 700;
    color: var(--slate); font-family: var(--font); line-height: 1;
  }
  .stat-label {
    font-size: 0.72rem; color: var(--muted);
    font-family: var(--font); margin-top: 3px; font-weight: 500;
  }

  /* ── ITEM GRID ── */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .item-card {
    background: var(--card); border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: box-shadow 0.22s, transform 0.22s;
    animation: fadeUp 0.3s ease both;
  }
  .item-card:hover {
    box-shadow: 0 6px 24px rgba(0,0,0,0.10);
    transform: translateY(-3px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .item-img-wrap {
    position: relative; height: 130px;
    background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .item-img-wrap .item-icon {
    font-size: 3rem; opacity: 0.35;
    transition: opacity 0.2s, transform 0.2s;
  }
  .item-card:hover .item-icon { opacity: 0.5; transform: scale(1.08); }

  .item-badge {
    position: absolute; top: 10px; right: 10px;
    padding: 3px 9px; border-radius: 20px;
    font-size: 0.7rem; font-weight: 700;
    font-family: var(--font); letter-spacing: 0.3px;
  }
  .badge-active   { background: #dcfce7; color: #14532d; }
  .badge-inactive { background: #fee2e2; color: #991b1b; }
  .badge-low      { background: #fef3c7; color: #78350f; }

  .item-body { padding: 14px 16px; }
  .item-name {
    font-size: 0.95rem; font-weight: 700;
    color: var(--slate); font-family: var(--font);
    margin-bottom: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .item-cat {
    font-size: 0.73rem; color: var(--muted);
    font-family: var(--font); margin-bottom: 10px;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .item-meta {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 12px;
  }
  .item-price {
    font-size: 1rem; font-weight: 700;
    color: var(--green-dark); font-family: var(--font);
  }
  .item-stock {
    font-size: 0.78rem; font-family: var(--font);
    color: var(--muted); font-weight: 500;
  }
  .item-stock span {
    font-weight: 700; color: var(--slate);
  }

  .item-actions {
    display: flex; gap: 8px;
  }
  .btn-edit, .btn-delete, .btn-toggle {
    flex: 1; padding: 7px 0; border-radius: 7px;
    font-family: var(--font); font-size: 0.78rem;
    font-weight: 600; cursor: pointer; border: none;
    transition: background 0.18s, transform 0.15s;
    display: flex; align-items: center;
    justify-content: center; gap: 5px;
  }
  .btn-edit {
    background: #eff6ff; color: #1d4ed8;
  }
  .btn-edit:hover { background: #dbeafe; transform: translateY(-1px); }
  .btn-delete {
    background: #fef2f2; color: #dc2626;
  }
  .btn-delete:hover { background: #fee2e2; transform: translateY(-1px); }
  .btn-toggle {
    background: #f0fdf4; color: #15803d;
  }
  .btn-toggle:hover { background: #dcfce7; transform: translateY(-1px); }

  /* ── MODAL ── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 2000;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }

  .modal {
    background: #fff; border-radius: 14px;
    width: 100%; max-width: 480px;
    padding: 28px 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    animation: modalIn 0.22s ease;
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-header {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 22px;
  }
  .modal-title {
    font-size: 1.1rem; font-weight: 700;
    color: var(--slate); font-family: var(--font);
  }
  .modal-title span { color: var(--green); }
  .modal-close {
    background: none; border: none;
    color: var(--muted); font-size: 18px; cursor: pointer;
    transition: color 0.2s;
  }
  .modal-close:hover { color: var(--slate); }

  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label {
    font-size: 0.75rem; font-weight: 700;
    color: var(--muted); font-family: var(--font);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .form-input, .form-select, .form-textarea {
    padding: 9px 12px; border-radius: 8px;
    border: 1.5px solid var(--border);
    font-family: var(--font); font-size: 0.85rem;
    color: var(--slate); background: #fafafa;
    outline: none; transition: border-color 0.2s, background 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--green); background: #fff;
  }
  .form-textarea { resize: vertical; min-height: 72px; }
  .form-select { cursor: pointer; }

  .modal-footer {
    display: flex; gap: 10px; margin-top: 22px;
    justify-content: flex-end;
  }
  .btn-cancel {
    padding: 9px 20px; border-radius: 8px;
    border: 1.5px solid var(--border); background: #fff;
    font-family: var(--font); font-size: 0.84rem;
    font-weight: 600; color: var(--muted); cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-cancel:hover { border-color: var(--slate); color: var(--slate); }
  .btn-save {
    padding: 9px 24px; border-radius: 8px;
    background: var(--green); color: #fff; border: none;
    font-family: var(--font); font-size: 0.84rem;
    font-weight: 600; cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-save:hover { background: var(--green-dark); transform: translateY(-1px); }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center; padding: 60px 20px;
    grid-column: 1 / -1;
  }
  .empty-state i { font-size: 3rem; color: #c7d2db; margin-bottom: 14px; }
  .empty-state p {
    font-family: var(--font); color: var(--muted);
    font-size: 0.9rem;
  }

  /* ── DELETE CONFIRM MODAL ── */
  .confirm-modal {
    background: #fff; border-radius: 14px;
    width: 100%; max-width: 360px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    animation: modalIn 0.22s ease;
    text-align: center;
  }
  .confirm-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: #fee2e2; color: #dc2626;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; margin: 0 auto 16px;
  }
  .confirm-title {
    font-size: 1rem; font-weight: 700;
    color: var(--slate); font-family: var(--font); margin-bottom: 8px;
  }
  .confirm-msg {
    font-size: 0.84rem; color: var(--muted);
    font-family: var(--font); margin-bottom: 22px; line-height: 1.5;
  }
  .confirm-actions { display: flex; gap: 10px; justify-content: center; }
  .btn-confirm-del {
    padding: 9px 24px; border-radius: 8px;
    background: var(--red); color: #fff; border: none;
    font-family: var(--font); font-size: 0.84rem;
    font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-confirm-del:hover { background: #dc2626; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--navy); color: #fff;
    padding: 12px 18px; border-radius: 9px;
    font-family: var(--font); font-size: 0.84rem;
    font-weight: 500; z-index: 3000;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    transform: translateY(80px); opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast i { color: var(--green-mid); }

  /* ── FOOTER ── */
  footer {
    text-align: center; padding: 14px;
    background: #161c22; color: rgba(255,255,255,0.4);
    font-size: 0.78rem; margin-top: auto;
    font-family: var(--font);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); padding-top: 0; }
    .sidebar.open { transform: translateX(0); box-shadow: 8px 0 30px rgba(0,0,0,0.2); }
    .sidebar-close { display: block; }
    .layout { margin-left: 0; }
    .content { padding: 18px 14px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
  }
  @media (max-width: 480px) {
    .page-title h2 { font-size: 1.1rem; }
    .stats-row { grid-template-columns: 1fr 1fr; }
  }

</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="Open menu">
    <i class="fas fa-bars"></i>
  </button>
  <a href="seller.html" class="logo"><i class="fas fa-leaf"></i> EcoSphere</a>
  <a href="seller_profile.html" class="profile-link" title="My Profile">
    <i class="fas fa-user-circle"></i>
  </a>
</header>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <button class="sidebar-close" onclick="closeSidebar()">
    <i class="fas fa-times"></i>
  </button>
  <div class="sidebar-brand">Seller Panel</div>
  <a href="seller.html"><i class="fas fa-home"></i> Dashboard</a>
  <a href="selle_orders.html"><i class="fas fa-shopping-bag"></i> Orders</a>
  <a href="selle_items.html" class="active"><i class="fas fa-box"></i> List Items</a>
  <a href="seller_profile.html"><i class="fas fa-user"></i> Profile</a>
  <div class="sidebar-spacer"></div>
  <a href="index.html" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
</aside>

<!-- LAYOUT -->
<div class="layout">
  <div class="content">

    <!-- PAGE TITLE -->
    <div class="page-title">
      <div class="page-title-left">
        <div class="page-title-icon"><i class="fas fa-box-open"></i></div>
        <h2>Listed <span>Items</span></h2>
      </div>
      <button class="btn-add" onclick="openAddModal()">
        <i class="fas fa-plus"></i> Add New Item
      </button>
    </div>

    <!-- STATS ROW -->
    <div class="stats-row" id="statsRow"></div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input class="search-input" type="text" id="searchInput"
               placeholder="Search items…" oninput="applyFilters()">
      </div>
      <select class="cat-select" id="catFilter" onchange="applyFilters()">
        <option value="all">All Categories</option>
        <option value="Plastic">Plastic</option>
        <option value="Paper">Paper</option>
        <option value="Metal">Metal</option>
        <option value="Glass">Glass</option>
        <option value="E-Waste">E-Waste</option>
        <option value="Cardboard">Cardboard</option>
        <option value="Textile">Textile</option>
        <option value="Other">Other</option>
      </select>
      <select class="cat-select" id="statusFilter" onchange="applyFilters()">
        <option value="all">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="low">Low Stock</option>
      </select>
    </div>

    <!-- ITEM GRID -->
    <div class="items-grid" id="itemsGrid"></div>

  </div>
  <footer>© 2026 EcoSphere. All rights reserved.</footer>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-bg" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add <span>New Item</span></div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label class="form-label">Item Name *</label>
        <input class="form-input" id="f_name" type="text" placeholder="e.g. PET Plastic Bottles">
      </div>
      <div class="form-group">
        <label class="form-label">Category *</label>
        <select class="form-select" id="f_cat">
          <option value="">Select…</option>
          <option>Plastic</option>
          <option>Paper</option>
          <option>Metal</option>
          <option>Glass</option>
          <option>E-Waste</option>
          <option>Cardboard</option>
          <option>Textile</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Price (₹/kg) *</label>
        <input class="form-input" id="f_price" type="number" placeholder="e.g. 12">
      </div>
      <div class="form-group">
        <label class="form-label">Stock (kg) *</label>
        <input class="form-input" id="f_stock" type="number" placeholder="e.g. 200">
      </div>
      <div class="form-group">
        <label class="form-label">Min Order (kg)</label>
        <input class="form-input" id="f_minorder" type="number" placeholder="e.g. 10">
      </div>
      <div class="form-group full">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="f_desc" placeholder="Brief description of the item…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="f_status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveItem()">
        <i class="fas fa-check"></i> Save Item
      </button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-bg" id="deleteModal">
  <div class="confirm-modal">
    <div class="confirm-icon"><i class="fas fa-trash-alt"></i></div>
    <div class="confirm-title">Delete Item?</div>
    <div class="confirm-msg">This action cannot be undone. The item will be permanently removed from your listings.</div>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-confirm-del" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script>
  /* ─── DATA ─── */
  const ICONS = {
    Plastic:'fa-recycle', Paper:'fa-newspaper', Metal:'fa-cog',
    Glass:'fa-wine-bottle', 'E-Waste':'fa-microchip',
    Cardboard:'fa-box', Textile:'fa-tshirt', Other:'fa-leaf'
  };

  let items = [
    { id:1, name:"PET Plastic Bottles",  cat:"Plastic",   price:12,  stock:350, minorder:20, desc:"Clean, sorted PET bottles. No caps.",       status:"active"   },
    { id:2, name:"Old Newspapers",        cat:"Paper",     price:8,   stock:180, minorder:10, desc:"Bundled old newspapers, dry condition.",     status:"active"   },
    { id:3, name:"Iron Scrap",            cat:"Metal",     price:28,  stock:600, minorder:50, desc:"Heavy iron scrap from industrial sources.",  status:"active"   },
    { id:4, name:"Clear Glass Bottles",   cat:"Glass",     price:6,   stock:90,  minorder:15, desc:"Sorted clear glass, washed.",                status:"low"      },
    { id:5, name:"Mixed E-Waste",         cat:"E-Waste",   price:55,  stock:45,  minorder:5,  desc:"Circuit boards, cables, small appliances.",  status:"active"   },
    { id:6, name:"Corrugated Cardboard",  cat:"Cardboard", price:7,   stock:12,  minorder:10, desc:"Flat & corrugated cardboard boxes.",          status:"low"      },
    { id:7, name:"Used Textiles",         cat:"Textile",   price:5,   stock:0,   minorder:10, desc:"Mixed used clothing and fabric scraps.",     status:"inactive" },
    { id:8, name:"Aluminium Cans",        cat:"Metal",     price:42,  stock:210, minorder:20, desc:"Crushed aluminium beverage cans.",           status:"active"   },
  ];

  let nextId = 9;
  let editingId = null;
  let deletingId = null;

  /* ─── RENDER ─── */
  function getStatusTag(item) {
    if (item.status === 'inactive') return { label:'Inactive', cls:'badge-inactive' };
    if (item.stock <= 20)           return { label:'Low Stock', cls:'badge-low' };
    return { label:'Active', cls:'badge-active' };
  }

  function renderGrid(list) {
    const grid = document.getElementById('itemsGrid');
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state">
        <i class="fas fa-box-open"></i>
        <p>No items found. Try adjusting your filters or add a new item.</p>
      </div>`;
      return;
    }
    grid.innerHTML = list.map((item, i) => {
      const tag = getStatusTag(item);
      const icon = ICONS[item.cat] || 'fa-leaf';
      return `
        <div class="item-card" style="animation-delay:${i * 0.04}s">
          <div class="item-img-wrap">
            <i class="fas ${icon} item-icon"></i>
            <span class="item-badge ${tag.cls}">${tag.label}</span>
          </div>
          <div class="item-body">
            <div class="item-name" title="${item.name}">${item.name}</div>
            <div class="item-cat">${item.cat}</div>
            <div class="item-meta">
              <div class="item-price">₹${item.price}/kg</div>
              <div class="item-stock">Stock: <span>${item.stock} kg</span></div>
            </div>
            <div class="item-actions">
              <button class="btn-edit"   onclick="openEditModal(${item.id})"><i class="fas fa-pen"></i> Edit</button>
              <button class="btn-toggle" onclick="toggleStatus(${item.id})"><i class="fas fa-power-off"></i> ${item.status==='active'||item.status==='low'?'Deactivate':'Activate'}</button>
              <button class="btn-delete" onclick="openDeleteModal(${item.id})"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderStats() {
    const total    = items.length;
    const active   = items.filter(i => i.status === 'active').length;
    const low      = items.filter(i => i.stock <= 20 && i.status !== 'inactive').length;
    const inactive = items.filter(i => i.status === 'inactive').length;
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-box"></i></div>
        <div class="stat-info"><div class="stat-value">${total}</div><div class="stat-label">Total Items</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info"><div class="stat-value">${active}</div><div class="stat-label">Active</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon amber"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="stat-info"><div class="stat-value">${low}</div><div class="stat-label">Low Stock</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-times-circle"></i></div>
        <div class="stat-info"><div class="stat-value">${inactive}</div><div class="stat-label">Inactive</div></div>
      </div>`;
  }

  function applyFilters() {
    const q   = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('catFilter').value;
    const st  = document.getElementById('statusFilter').value;
    const list = items.filter(item => {
      const tag = getStatusTag(item);
      const matchQ   = item.name.toLowerCase().includes(q) || item.cat.toLowerCase().includes(q);
      const matchCat = cat === 'all' || item.cat === cat;
      const matchSt  = st  === 'all'
        || (st === 'active'   && item.status === 'active' && item.stock > 20)
        || (st === 'inactive' && item.status === 'inactive')
        || (st === 'low'      && item.stock <= 20 && item.status !== 'inactive');
      return matchQ && matchCat && matchSt;
    });
    renderGrid(list);
  }

  /* ─── MODAL ─── */
  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').innerHTML = 'Add <span>New Item</span>';
    clearForm();
    document.getElementById('itemModal').classList.add('show');
  }

  function openEditModal(id) {
    editingId = id;
    const item = items.find(i => i.id === id);
    document.getElementById('modalTitle').innerHTML = 'Edit <span>Item</span>';
    document.getElementById('f_name').value     = item.name;
    document.getElementById('f_cat').value      = item.cat;
    document.getElementById('f_price').value    = item.price;
    document.getElementById('f_stock').value    = item.stock;
    document.getElementById('f_minorder').value = item.minorder;
    document.getElementById('f_desc').value     = item.desc;
    document.getElementById('f_status').value   = item.status === 'low' ? 'active' : item.status;
    document.getElementById('itemModal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('itemModal').classList.remove('show');
    clearForm();
  }

  function clearForm() {
    ['f_name','f_cat','f_price','f_stock','f_minorder','f_desc'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('f_status').value = 'active';
  }

  function saveItem() {
    const name     = document.getElementById('f_name').value.trim();
    const cat      = document.getElementById('f_cat').value;
    const price    = parseFloat(document.getElementById('f_price').value);
    const stock    = parseFloat(document.getElementById('f_stock').value);
    const minorder = parseFloat(document.getElementById('f_minorder').value) || 0;
    const desc     = document.getElementById('f_desc').value.trim();
    const status   = document.getElementById('f_status').value;

    if (!name || !cat || isNaN(price) || isNaN(stock)) {
      showToast('Please fill in all required fields.', true); return;
    }

    if (editingId) {
      const idx = items.findIndex(i => i.id === editingId);
      items[idx] = { ...items[idx], name, cat, price, stock, minorder, desc, status };
      showToast('Item updated successfully!');
    } else {
      items.unshift({ id: nextId++, name, cat, price, stock, minorder, desc, status });
      showToast('Item added successfully!');
    }
    closeModal();
    renderStats();
    applyFilters();
  }

  /* ─── DELETE ─── */
  function openDeleteModal(id) {
    deletingId = id;
    document.getElementById('deleteModal').classList.add('show');
  }
  function closeDeleteModal() {
    deletingId = null;
    document.getElementById('deleteModal').classList.remove('show');
  }
  function confirmDelete() {
    items = items.filter(i => i.id !== deletingId);
    closeDeleteModal();
    renderStats();
    applyFilters();
    showToast('Item deleted.');
  }

  /* ─── TOGGLE STATUS ─── */
  function toggleStatus(id) {
    const item = items.find(i => i.id === id);
    item.status = (item.status === 'inactive') ? 'active' : 'inactive';
    renderStats();
    applyFilters();
    showToast(item.status === 'active' ? 'Item activated.' : 'Item deactivated.');
  }

  /* ─── TOAST ─── */
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ─── SIDEBAR ─── */
  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("overlay").classList.toggle("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }
  document.querySelectorAll(".sidebar a").forEach(l => l.addEventListener("click", closeSidebar));

  /* ─── INIT ─── */
  renderStats();
  renderGrid(items);

</script>
</body>
</html>
