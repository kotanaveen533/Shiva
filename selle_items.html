<!DOCTYPE html>
<html>
<head>
<title>Items</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f6f8;
display:flex;
flex-direction:column;
min-height:100vh;
}

/* HEADER */
.header{
position:fixed;
top:0;
width:100%;
height:80px;
background:#12ba11;
z-index:1000;
}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
max-width:1200px;
margin:auto;
padding:1rem 2rem;
}

.logo h1{ color:white; }
.logo i{ color:#ffd700; }

.profile-mini{
font-size:25px;
}
.profile-mini i{ color:#fff; }

/* DASHBOARD */
.dashboard{
margin-top:80px;
display:flex;
flex:1;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#1e293b;
color:white;
padding-top:20px;
height:100vh;
position:fixed;
}

.admin-logo{
display:flex;
align-items:center;
gap:10px;
padding:20px;
font-size:20px;
font-weight:bold;
color:#ffd700;
border-bottom:1px solid #334155;
}

.sidebar a{
display:block;
padding:12px 20px;
color:white;
text-decoration:none;
cursor:pointer;
transition:0.3s;
}

.sidebar a i{ margin-right:10px; }

.sidebar a:hover, .sidebar a.active{
background:#334155;
padding-left:25px;
}

/* MAIN */
.main{
margin-left:220px;
padding:20px;
width:100%;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

table, th, td{
border:1px solid #ccc;
}

th{
background:#1e293b;
color:white;
}

th, td{
padding:10px;
text-align:center;
}

/* BUTTON */
button{
padding:8px 12px;
background:#2ecc71;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#27ae60;
}

/* MODAL */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:20px;
width:300px;
border-radius:10px;
}

.modal input{
width:100%;
padding:8px;
margin:5px 0;
}

.preview{
width:100%;
height:100px;
object-fit:cover;
margin-top:10px;
}

/* FOOTER */
.footer-bottom{
text-align:center;
padding:15px;
background:#1a1a1a;
color:#aaa;
width:100%;
margin-top:auto;
}
</style>

</head>

<body>

<header class="header">
<nav class="nav">
<div class="logo">
<h1><i class="fas fa-leaf"></i> EcoSphere</h1>
</div>

<div class="profile-mini">
<a href="./seller_profile.html"><i class="fas fa-user-circle"></i></a>
</div>
</nav>
</header>

<div class="dashboard">

<aside class="sidebar">
<div class="admin-logo">
<i class="fas fa-store"></i>
<span>Seller Panel</span>
</div>

<a href="./seller.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
<a href="./selle_orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
<a href="./selle_items.html" class="active"><i class="fas fa-box-open"></i> List Items</a>
<a href="./index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
</aside>

<div class="main">

<button onclick="openModal()">+ Add Item</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Seller</th>
<th>Qty</th>
<th>Image</th>
<th>Category</th>
<th>Email</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>

<tbody id="items"></tbody>
</table>

</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<h3>Add Item</h3>

<input type="text" id="name" placeholder="Item Name">
<input type="text" id="qty" placeholder="Quantity">
<input type="text" id="category" placeholder="Category">
<input type="text" id="email" placeholder="Phone / Email">
<input type="date" id="date">

<input type="file" id="imageFile" accept="image/*">
<img id="preview" class="preview" src="">

<br><br>

<button onclick="saveItem()">Save</button>
<button onclick="closeModal()">Cancel</button>

</div>
</div>

<footer class="footer-bottom">
<p>© 2026 EcoSphere. All rights reserved.</p>
</footer>

<script>

/* GET ELEMENTS */
const name = document.getElementById("name");
const qty = document.getElementById("qty");
const category = document.getElementById("category");
const email = document.getElementById("email");
const date = document.getElementById("date");
const imageFile = document.getElementById("imageFile");
const preview = document.getElementById("preview");

/* STORAGE + SAMPLE DATA */
let items = JSON.parse(localStorage.getItem("items"));

if(!items || items.length === 0){
items = [
{
name:"Old Newspaper",
qty:"10 Kg",
category:"Paper",
email:"seller1@gmail.com",
image:"https://www.nationalpaper-recycling.co.uk/wp-content/uploads/2024/03/national-paper-recycling.jpg",
date:"2026-04-01"
},
{
name:"Plastic Bottles",
qty:"25 Pieces",
category:"Plastic",
email:"seller2@gmail.com",
image:"https://www.kaironggroup.com/wp-content/uploads/2025/11/Plastic-Recycling-Line-1.webp",
date:"2026-04-05"
},
{
name:"Iron Scrap",
qty:"15 Kg",
category:"Metal",
email:"seller3@gmail.com",
image:"https://www.mckinstrymetalrecycling.co.uk/wp-content/uploads/2025/03/Images-for-blogs-scaled.jpg",
date:"2026-04-06"
},
{
name:"Cardboard Boxes",
qty:"20 Pieces",
category:"Paper",
email:"seller4@gmail.com",
image:"https://iol-prod.appspot.com/image/bb271b3a964f341aca618c93dbe3ee9e1e9d7ae4/4032/jpeg",
date:"2026-04-07"
},
{
name:"Glass Bottles",
qty:"30 Pieces",
category:"Glass",
email:"seller5@gmail.com",
image:"http://www.rowellpackage.com/wp-content/uploads/2023/11/glass-recycle-scaled.jpg",
date:"2026-04-07"
}
];

localStorage.setItem("items", JSON.stringify(items));
}

/* LOAD */
function loadItems(){
let el=document.getElementById("items");

if(items.length === 0){
el.innerHTML = `<tr><td colspan="8">No Items Available</td></tr>`;
return;
}

el.innerHTML=items.map((i,index)=>`
<tr>
<td>${i.name}</td>
<td>You</td>
<td>${i.qty}</td>
<td>${i.image ? `<img src="${i.image}" width="60">` : "No Image"}</td>
<td>${i.category}</td>
<td>${i.email}</td>
<td>${i.date}</td>
<td><button onclick="deleteItem(${index})">Delete</button></td>
</tr>
`).join("");
}

/* MODAL */
function openModal(){
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
clearForm();
}

/* CLEAR */
function clearForm(){
name.value="";
qty.value="";
category.value="";
email.value="";
date.value="";
imageFile.value="";
preview.src="";
}

/* IMAGE PREVIEW */
imageFile.addEventListener("change", function(){
let file=this.files[0];
if(file){
let reader=new FileReader();
reader.onload=e=>preview.src=e.target.result;
reader.readAsDataURL(file);
}
});

/* SAVE */
function saveItem(){

if(!name.value || !qty.value || !date.value || !email.value){
alert("Fill all fields");
return;
}

items.push({
name:name.value,
qty:qty.value,
category:category.value,
email:email.value,
image:preview.src,
date:date.value
});

localStorage.setItem("items", JSON.stringify(items));

loadItems();
closeModal();
}

/* DELETE */
function deleteItem(index){
items.splice(index,1);
localStorage.setItem("items", JSON.stringify(items));
loadItems();
}

/* INIT */
loadItems();

</script>

</body>
</html>
